{
  // ISC Kea DHCPv4 - red 10.10.0.0/24 de empresa.internal
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      // "raw" permite atender a clientes que aún no tienen IP (DISCOVER por broadcast)
      "dhcp-socket-type": "raw"
    },

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },

    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "authoritative": true,

    "option-data": [
      { "name": "domain-name-servers", "data": "10.10.0.53" },
      { "name": "domain-name",         "data": "empresa.internal" },
      { "name": "domain-search",       "data": "empresa.internal" }
    ],

    "subnet4": [
      {
        "id": 1,
        "subnet": "10.10.0.0/24",
        "pools": [ { "pool": "10.10.0.100 - 10.10.0.199" } ],
        "option-data": [
          { "name": "routers", "data": "10.10.0.1" }
        ],
        "reservations": [
          {
            "hw-address": "02:00:00:00:00:50",
            "ip-address": "10.10.0.50",
            "hostname": "impresora"
          }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "stdout", "pattern": "%D{%Y-%m-%d %H:%M:%S} %-5p %m\n" } ],
        "severity": "INFO"
      }
    ]
  }
}
