// BIND9 - servidor DNS interno de empresa.internal
// ".internal" está reservado por ICANN (2024) para redes privadas: nunca
// colisionará con un dominio real ni con mDNS, a diferencia de ".local".

acl red_interna { 10.10.0.0/24; 127.0.0.1; };

options {
    directory "/var/cache/bind";
    pid-file "/run/named/named.pid";

    listen-on    { any; };
    listen-on-v6 { none; };

    // Solo la LAN puede preguntar y usar la recursión: evita ser un
    // resolutor abierto (amplificación DDoS).
    allow-query     { red_interna; };
    recursion yes;
    allow-recursion { red_interna; };
    forwarders { 9.9.9.9; 1.1.1.1; };
    dnssec-validation auto;

    allow-transfer { none; };     // sin transferencias de zona a terceros
    version "no disponible";      // no revelar la versión de BIND
    minimal-responses yes;
};

logging {
    channel salida { stderr; severity info; print-time yes; print-category yes; };
    category default { salida; };
    category queries { salida; };
};

zone "empresa.internal" {
    type primary;
    file "/etc/bind/zones/db.empresa.internal";
};

zone "0.10.10.in-addr.arpa" {
    type primary;
    file "/etc/bind/zones/db.10.10.0";
};
