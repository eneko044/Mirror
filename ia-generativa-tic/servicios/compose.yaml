# Infraestructura de servicios de red para una pyme ficticia (empresa.internal).
# Arranque:  ./generar-secretos.sh && docker compose up -d --build --wait
# Pruebas:   ./verificar.sh
name: servicios

x-endurecido: &endurecido
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1
          # Docker solo reparte IPs dinámicas en .224-.254: así nunca pisa ni
          # las IPs fijas de los servidores ni el pool que reparte Kea (.100-.199).
          ip_range: 10.10.0.224/27

secrets:
  db_root_password: { file: ./secrets/db_root_password }
  db_app_password:  { file: ./secrets/db_app_password }
  tls_cert:         { file: ./secrets/tls/web.crt }
  tls_key:          { file: ./secrets/tls/web.key }

volumes:
  db_datos:
  dhcp_leases:
  sftp_datos:
  sftp_hostkeys:

services:
  # --- DNS: BIND9 autoritativo para empresa.internal + resolutor solo para la LAN
  dns:
    <<: *endurecido
    build: ./dns
    image: servicios/dns:1.0
    networks:
      lan: { ipv4_address: 10.10.0.53 }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    read_only: true
    # named arranca como root y baja al usuario "bind": este debe poder escribir aquí.
    tmpfs: ["/var/cache/bind:mode=1777", "/run/named:mode=1777"]
    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "+short", "+time=2", "ns1.empresa.internal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- DHCP: ISC Kea (sucesor de isc-dhcp-server, que llegó a fin de vida en 2022)
  dhcp:
    <<: *endurecido
    build: ./dhcp
    image: servicios/dhcp:1.0
    networks:
      lan: { ipv4_address: 10.10.0.67 }
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_BIND_SERVICE]
    volumes:
      - dhcp_leases:/var/lib/kea
    depends_on:
      dns: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x kea-dhcp4 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Web: Nginx con HTTPS, redirección 80->443 y cabeceras de seguridad
  web:
    <<: *endurecido
    image: nginx:1.27-alpine
    networks:
      lan: { ipv4_address: 10.10.0.80 }
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:80"
      - "${BIND_IP:-127.0.0.1}:8443:443"
    secrets: [tls_cert, tls_key]
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/salud"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Base de datos: MariaDB LTS, sin puerto publicado, contraseñas como secretos
  db:
    <<: *endurecido
    image: mariadb:11.4
    networks:
      lan: { ipv4_address: 10.10.0.33 }
    secrets: [db_root_password, db_app_password]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: inventario
      MARIADB_AUTO_UPGRADE: "1"
      TZ: Europe/Madrid
    volumes:
      - db_datos:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- SFTP: OpenSSH solo-SFTP, enjaulado (chroot), solo autenticación por clave
  sftp:
    <<: *endurecido
    build: ./sftp
    image: servicios/sftp:1.0
    networks:
      lan: { ipv4_address: 10.10.0.22 }
    ports:
      - "${BIND_IP:-127.0.0.1}:2222:22"
    volumes:
      - sftp_datos:/srv/sftp/intercambio/subidas
      - sftp_hostkeys:/etc/ssh/claves_host
      - ./secrets/sftp_authorized_keys:/etc/ssh/authorized_keys/intercambio:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, SYS_CHROOT, AUDIT_WRITE, DAC_OVERRIDE, FOWNER]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Clientes de prueba (solo con: docker compose --profile pruebas ...)
  cliente:
    profiles: [pruebas]
    build: ./pruebas
    image: servicios/cliente:1.0
    networks: [lan]
    dns: [10.10.0.53]
    dns_search: [empresa.internal]
    secrets: [tls_cert, db_app_password]
    volumes:
      - ./secrets/sftp_ed25519:/root/.ssh/id_ed25519:ro

  cliente-dhcp:
    profiles: [pruebas]
    image: busybox:1.36
    networks: [lan]
    command: ["udhcpc", "-i", "eth0", "-f", "-q", "-n", "-t", "5", "-s", "/bin/true"]
