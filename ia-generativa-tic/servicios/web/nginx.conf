# Nginx - intranet de empresa.internal
user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;
error_log  /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile        on;
    server_tokens   off;            # no mostrar la versión en cabeceras ni errores
    client_max_body_size 10m;
    keepalive_timeout 30s;

    # HTTP: solo redirige a HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;                   # desde Nginx 1.25.1 ("listen ... http2" está obsoleto)
        server_name web.empresa.internal www.empresa.internal intranet.empresa.internal;

        ssl_certificate      /run/secrets/tls_cert;
        ssl_certificate_key  /run/secrets/tls_key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        root  /usr/share/nginx/html;
        index index.html;

        location = /salud {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Nunca servir ficheros ocultos (.git, .env, .htpasswd...)
        location ~ /\. {
            deny all;
        }
    }
}
